<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DownTube Downloader</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Down<span>Tube</span> Downloader</h1>
        
        <div class="input-group">
            <label for="videoURL">YouTube Video URL</label>
            <input type="text" id="videoURL" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        </div>

        <div class="input-group">
            <label for="videoQuality">Select Video Quality</label>
            <select id="videoQuality" aria-label="Video Quality Selection">
                <option value="1080p">1080p (Full HD - Best Quality)</option>
                <option value="720p">720p (HD - Standard)</option>
                <option value="480p">480p (SD - Data Saver)</option>
                <option value="audio">Audio Only (M4A/MP3 Music)</option>
            </select>
        </div>

        <button onclick="startDownload()">Download Now</button>
        
        <div class="info-text" id="statusMessage"></div>
    </div>
    <div id="file-gallery" style="margin-top: 30px; color: white;">
    <h3> Completed Downloads</h3>
    <ul id="file-list" style="list-style: none; padding: 0;">
        </ul>
    <button onclick="loadFiles()" style="padding: 10px; cursor: pointer;">Refresh List</button>
</div>

    <script>
        function startDownload() {
            const url = document.getElementById('videoURL').value;
            const quality = document.getElementById('videoQuality').value;
            const status = document.getElementById('statusMessage');

            if(!url) {
                alert("Please enter a valid YouTube video URL.");
                return;
            }
            
            status.innerHTML = "⏳ Starting download process...";

           
            const loadingLink = `http://localhost:4000/start?url=${encodeURIComponent(url)}&quality=${quality}`;
            
           
            window.open(loadingLink, '_blank');

           
            setTimeout(() => {
                status.innerHTML = " Processing in the new tab. Please wait...";
            }, 3000);
        }
        function loadFiles() {
        fetch('/list-files')
            .then(res => res.json())
            .then(files => {
                const list = document.getElementById('file-list');
                list.innerHTML = ''; 
                
                files.forEach(file => {
                    const listItem = document.createElement('li');
                    listItem.style.margin = "10px 0";
                    listItem.innerHTML = `
                        <span>🎥 ${file}</span> 
                        <a href="/view-file/${encodeURIComponent(file)}" target="_blank" 
                           style="color: #ff4757; margin-left: 20px; font-weight: bold;">
                           Download/Play
                        </a>
                    `;
                    list.appendChild(listItem);
                });
            });
    }

    window.onload = loadFiles;
    </script>
</body>
</html>
